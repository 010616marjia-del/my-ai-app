
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Learning App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }
    .app {
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { color: #3156d9; text-align: center; }
    .subtitle { text-align: center; color: #555; }
    .subjects { display: flex; gap: 8px; margin: 20px 0; }
    .subject-btn {
      flex: 1;
      padding: 12px 5px;
      border: 0;
      border-radius: 9px;
      background: #dce4ff;
      color: #2446b5;
      font-weight: bold;
      cursor: pointer;
    }
    .subject-btn.active { background: #3156d9; color: white; }
    #selected { font-weight: bold; color: #3156d9; }
    #chat {
      min-height: 150px;
      padding: 15px;
      margin: 15px 0;
      background: #f5f6fa;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }
    .send-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #16834a;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <div class="app">
    <h1>My AI Learning App 🤖</h1>
    <p class="subtitle">Learn English, Math and Science!</p>

    <p><b>Choose Your Subject:</b></p>

    <div class="subjects">
      <button class="subject-btn active" onclick="chooseSubject('English', this)">English</button>
      <button class="subject-btn" onclick="chooseSubject('Math', this)">Math</button>
      <button class="subject-btn" onclick="chooseSubject('Science', this)">Science</button>
    </div>

    <p id="selected">Selected Subject: English</p>

    <div id="chat">Hello! Welcome to My AI Learning App. Choose a subject and ask a question.</div>

    <input id="question" type="text" placeholder="Type your question here...">

    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    let selectedSubject = "English";

    function chooseSubject(subject, button) {
      selectedSubject = subject;
      document.getElementById("selected").textContent =
        "Selected Subject: " + subject;

      document.querySelectorAll(".subject-btn").forEach(btn =>
        btn.classList.remove("active")
      );

      button.classList.add("active");
    }

    async function sendMessage() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");
      const sendBtn = document.getElementById("sendBtn");
      const message = input.value.trim();

      if (!message) {
        chat.textContent = "Please type a question first.";
        return;
      }

      chat.textContent = "You: " + message + "\n\nPlease wait...";
      sendBtn.disabled = true;

      try {
        const response = await fetch(
          "https://my-ai-app-backend-f9sx.onrender.com/chat",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: selectedSubject + ": " + message
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Server error");
        }

        chat.textContent = "You: " + message + "\n\nAI: " + data.reply;
        input.value = "";
      } catch (error) {
        chat.textContent = "Connection Error: " + error.message;
      } finally {
        sendBtn.disabled = false;
      }
    }

    document.getElementById("question").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
